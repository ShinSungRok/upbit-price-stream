services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: upbit-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:0.30.0
    container_name: upbit-lgtm
    ports:
      - "13000:3000" # Grafana UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: upbit-collector
    depends_on:
      kafka:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_SERVICE_NAME: collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    restart: unless-stopped

  apicurio-registry:
    image: apicurio/apicurio-registry:3.3.1
    container_name: upbit-apicurio-registry
    ports:
      - "18084:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/registry/v3/system/info || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  stream-processor:
    build:
      context: .
      dockerfile: stream-processor/Dockerfile
    container_name: upbit-stream-processor
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APICURIO_REGISTRY_URL: http://apicurio-registry:8080/apis/registry/v3
      OTEL_SERVICE_NAME: stream-processor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: upbit-api-server
    depends_on:
      kafka:
        condition: service_healthy
      valkey:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      APICURIO_REGISTRY_URL: http://apicurio-registry:8080/apis/registry/v3
      OTEL_SERVICE_NAME: api-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: upbit-valkey
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  questdb:
    image: questdb/questdb:9.4.3
    container_name: upbit-questdb
    ports:
      - "19000:9000" # web console + ILP-over-HTTP
      - "18812:8812" # Postgres wire (psql/JDBC)
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9003/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  history-api:
    build:
      context: .
      dockerfile: history-api/Dockerfile
    container_name: upbit-history-api
    depends_on:
      kafka:
        condition: service_healthy
      questdb:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    ports:
      - "18083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      QUESTDB_ILP_ADDRESS: questdb:9000
      QUESTDB_JDBC_URL: jdbc:postgresql://questdb:8812/qdb
      APICURIO_REGISTRY_URL: http://apicurio-registry:8080/apis/registry/v3
      OTEL_SERVICE_NAME: history-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    restart: unless-stopped

volumes:
  questdb-data:
