[versions]
kotlin = "2.3.20"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
questdb-client = "1.3.6"
avro = "1.12.0"
apicurio-avro-serde = "3.0.8"

[libraries]
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
questdb-client = { module = "org.questdb:questdb-client", version.ref = "questdb-client" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
apicurio-avro-serde = { module = "io.apicurio:apicurio-registry-avro-serde-kafka", version.ref = "apicurio-avro-serde" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
