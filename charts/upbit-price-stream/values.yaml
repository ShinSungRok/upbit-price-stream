kafka:
  clusterName: upbit-kafka
  version: 4.2.1
  metadataVersion: 4.2-IV1
  jvmHeap: 384m
  resources:
    requests:
      memory: 640Mi
      cpu: 250m
    limits:
      memory: 640Mi
      cpu: 1000m

collector:
  image:
    repository: upbit-price-stream-collector
    tag: latest
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

streamProcessor:
  image:
    repository: upbit-price-stream-stream-processor
    tag: latest
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

apiServer:
  image:
    repository: upbit-price-stream-api-server
    tag: latest
  resources:
    requests:
      memory: 288Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  service:
    port: 8080

questdb:
  image:
    repository: questdb/questdb
    tag: 9.4.3
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 768Mi
      cpu: 500m
  storage:
    size: 1Gi
  service:
    httpPort: 9000
    pgWirePort: 8812

historyApi:
  image:
    repository: upbit-price-stream-history-api
    tag: latest
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 384Mi
      cpu: 500m
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  service:
    port: 8083

valkey:
  image:
    repository: valkey/valkey
    tag: 8.1-alpine
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 250m
  service:
    port: 6379

apicurioRegistry:
  image:
    repository: apicurio/apicurio-registry
    tag: 3.3.1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  service:
    port: 8080
